
name: CMath Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: cmath-release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: "23.1.4"
  VCPKG_ROOT: "C:\\vcpkg"

jobs:
  build-and-release:
    name: Build and release CMath (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # --------------------------------------------------
      # LLVM
      # --------------------------------------------------

      - name: Restore LLVM archive cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst
          key: llvm-23.1.4-windows-x64-1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091

      - name: Download and verify LLVM 23.1.4
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $llvmArchiveName = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.zst"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$llvmArchiveName"
          $llvmArchive = Join-Path $env:RUNNER_TEMP $llvmArchiveName

          $expectedSha256 = "1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091"

          if (Test-Path $llvmArchive) {
            Write-Host "Using cached LLVM archive: $llvmArchive"
          }
          else {
            Write-Host "Downloading LLVM $env:LLVM_VERSION developer archive..."

            & curl.exe --location --fail --show-error `
              --retry 5 --retry-all-errors --retry-delay 5 `
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 `
              --max-time 1800 --progress-bar `
              --output $llvmArchive $llvmUrl

            if ($LASTEXITCODE -ne 0) {
              throw "LLVM download failed with curl exit code $LASTEXITCODE."
            }
          }

          Write-Host "Verifying LLVM archive SHA-256..."

          $actualSha256 = (Get-FileHash $llvmArchive -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item $llvmArchive -Force -ErrorAction SilentlyContinue
            throw "LLVM archive SHA-256 mismatch. Expected $expectedSha256, got $actualSha256."
          }

          Write-Host "LLVM archive checksum verified."

      - name: Save LLVM archive cache
        if: success() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst
          key: llvm-23.1.4-windows-x64-1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091

      - name: Extract LLVM archive
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $llvmArchive = Join-Path $env:RUNNER_TEMP "clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst"
          $tarArchive = Join-Path $env:RUNNER_TEMP "llvm.tar"

          if (-not (Test-Path $llvmArchive)) {
            throw "LLVM archive not found: $llvmArchive"
          }

          Write-Host "Installing Zstandard decompression support..."

          python -m pip install --disable-pip-version-check --no-warn-script-location zstandard

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Python zstandard."
          }

          $env:LLVM_ARCHIVE_PATH = $llvmArchive
          $env:LLVM_TAR_PATH = $tarArchive

          Write-Host "Decompressing LLVM archive..."

          @'
          import os
          import zstandard

          source_path = os.environ["LLVM_ARCHIVE_PATH"]
          target_path = os.environ["LLVM_TAR_PATH"]

          with open(source_path, "rb") as source:
              with open(target_path, "wb") as target:
                  decompressor = zstandard.ZstdDecompressor(
                      max_window_size=2**31
                  )
                  decompressor.copy_stream(source, target)

          print("LLVM decompression completed.")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to decompress LLVM archive."
          }

          Write-Host "Extracting LLVM files..."

          tar.exe -xf $tarArchive -C $env:RUNNER_TEMP

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM tar archive."
          }

          Remove-Item $tarArchive -Force

          $llvmRoot = Join-Path $env:RUNNER_TEMP "clang+llvm-23.1.4-x86_64-pc-windows-msvc"

          if (-not (Test-Path (Join-Path $llvmRoot "bin/clang++.exe"))) {
            throw "LLVM extraction failed: clang++.exe was not found."
          }

          if (-not (Test-Path (Join-Path $llvmRoot "lib/cmake/llvm/LLVMConfig.cmake"))) {
            throw "LLVM extraction failed: LLVMConfig.cmake was not found."
          }

          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LLVM_DIR=$(Join-Path $llvmRoot 'lib/cmake/llvm')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "LLVM_ROOT=$llvmRoot"
          Write-Host "LLVM extraction completed successfully."

      # --------------------------------------------------
      # vcpkg dependencies
      # --------------------------------------------------

      - name: Restore vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-2022-x64-static-zstd-zlib-${{ hashFiles('cmake/CMathNativeCompiler.cmake') }}
          restore-keys: |
            vcpkg-windows-2022-x64-static-zstd-zlib-

      - name: Install zstd and zlib dependencies
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_DISABLE_METRICS = "1"

          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"

          if (-not (Test-Path $vcpkgExe)) {
            throw "The runner's vcpkg executable was not found: $vcpkgExe"
          }

          if (-not (Test-Path $vcpkgToolchain)) {
            throw "The vcpkg CMake toolchain was not found: $vcpkgToolchain"
          }

          Write-Host "Using vcpkg at $env:VCPKG_ROOT"

          & $vcpkgExe version

          if ($LASTEXITCODE -ne 0) {
            throw "Could not query the vcpkg version."
          }

          Write-Host "Installing zstd:x64-windows-static and zlib:x64-windows-static..."

          & $vcpkgExe install zstd:x64-windows-static zlib:x64-windows-static

          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install zstd and zlib."
          }

          $installedDir = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static"
          $zstdConfig = Join-Path $installedDir "share/zstd/zstdConfig.cmake"
          $zlibHeader = Join-Path $installedDir "include/zlib.h"
          $zlibWrapper = Join-Path $installedDir "share/zlib/vcpkg-cmake-wrapper.cmake"

          if (-not (Test-Path $zstdConfig)) {
            throw "zstdConfig.cmake was not found at $zstdConfig"
          }

          if (-not (Test-Path $zlibHeader)) {
            throw "zlib.h was not found at $zlibHeader"
          }

          if (-not (Test-Path $zlibWrapper)) {
            throw "vcpkg's zlib CMake wrapper was not found at $zlibWrapper"
          }

          Write-Host "Installed zlib libraries:"

          Get-ChildItem (Join-Path $installedDir "lib") -Filter "*.lib" |
            ForEach-Object { Write-Host "  $($_.Name)" }

          Write-Host "zstd and zlib dependencies are ready."

      - name: Save vcpkg dependency cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-2022-x64-static-zstd-zlib-${{ hashFiles('cmake/CMathNativeCompiler.cmake') }}

      # --------------------------------------------------
      # Visual Studio
      # --------------------------------------------------

      - name: Locate Visual Studio DIA SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio/Installer/vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere."
          }

          $vsInstall = & $vswhere -latest -products "*" -property installationPath

          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw "Could not locate the Visual Studio installation."
          }

          $diaDir = Join-Path $vsInstall "DIA SDK"

          if (-not (Test-Path $diaDir)) {
            throw "Visual Studio DIA SDK was not found at $diaDir."
          }

          "MSVC_DIA_SDK_DIR=$diaDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "DIA SDK found at $diaDir"

      # --------------------------------------------------
      # CMake configuration and build
      # --------------------------------------------------

      - name: Configure CMake
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"

          $clangxx = Join-Path $env:LLVM_ROOT "bin/clang++.exe"
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          $installedDir = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static"
          $zstdDir = Join-Path $installedDir "share/zstd"

          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64 `
            "-DLLVM_DIR=$env:LLVM_DIR" `
            "-DMSVC_DIA_SDK_DIR=$env:MSVC_DIA_SDK_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
            "-Dzstd_DIR=$zstdDir" `
            "-DZLIB_ROOT=$installedDir" `
            "-DCMATH_CLANGXX_EXECUTABLE=$clangxx"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build mathmake
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build-x64 --config Release --target mathmake --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "The mathmake build failed."
          }

      # --------------------------------------------------
      # Build-directory smoke test
      # --------------------------------------------------

      - name: Verify compiler version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = & .\build-x64\Release\mathmake.exe --version

          if ($LASTEXITCODE -ne 0) {
            throw "mathmake --version failed."
          }

          Write-Host $version

          if ($version -notmatch "0\.2") {
            throw "Expected a CMath 0.2 mathmake binary, got: $version"
          }

      - name: Run native compiler smoke test
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          $output = & .\build-x64\Release\mathmake.exe run .\examples\native_smoke.cmath 2>&1
          $exitCode = $LASTEXITCODE

          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "The native compiler smoke test failed with exit code $exitCode."
          }

          $hasExpectedOutput = $output | Where-Object { "$($_)".Trim() -eq "30" }

          if (-not $hasExpectedOutput) {
            throw "The native smoke test did not print its expected result (30)."
          }

      # --------------------------------------------------
      # Package release
      # --------------------------------------------------

      - name: Package release files
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:GITHUB_REF_NAME
          $packageDir = Join-Path $env:RUNNER_TEMP "CMath-release"

          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item ".\build-x64\Release\mathmake.exe" $packageDir
          Copy-Item ".\README.md" $packageDir
          Copy-Item ".\LICENSE" $packageDir

          $examplesDir = Join-Path $packageDir "examples"
          New-Item -ItemType Directory -Force -Path $examplesDir | Out-Null

          Copy-Item ".\examples\native_smoke.cmath" $examplesDir

          if (Test-Path ".\examples\native_functions.cmath") {
            Copy-Item ".\examples\native_functions.cmath" $examplesDir
          }

          # Bundle every LLVM runtime DLL from the same LLVM distribution.
          # The package does not include clang++.exe itself.
          $llvmBin = Join-Path $env:LLVM_ROOT "bin"
          $llvmDlls = @(Get-ChildItem -LiteralPath $llvmBin -Filter "*.dll" -File)

          foreach ($dll in $llvmDlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination $packageDir -Force
            Write-Host "Bundled LLVM runtime: $($dll.Name)"
          }

          if ($llvmDlls.Count -eq 0) {
            Write-Host "No LLVM runtime DLLs were found; checking the package will validate whether they are needed."
          }

          $archiveName = "CMath-$tag-windows-x64.zip"

          Compress-Archive `
            -Path (Join-Path $packageDir "*") `
            -DestinationPath $archiveName `
            -Force

          $sha256 = (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()

          [System.IO.File]::WriteAllText(
            "$archiveName.sha256",
            "$sha256  $archiveName`n"
          )

          Write-Host "Created $archiveName"
          Write-Host "SHA-256: $sha256"

      # --------------------------------------------------
      # Verify the actual distributed package
      # --------------------------------------------------

      - name: Verify release archive and packaged compiler
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:GITHUB_REF_NAME
          $archiveName = "CMath-$tag-windows-x64.zip"
          $checksumFile = "$archiveName.sha256"

          # 1. Verify the checksum file against the actual ZIP.

          if (-not (Test-Path $archiveName)) {
            throw "Release archive was not created: $archiveName"
          }

          if (-not (Test-Path $checksumFile)) {
            throw "Release checksum file was not created: $checksumFile"
          }

          $checksumText = Get-Content -LiteralPath $checksumFile -Raw
          $checksumMatch = [regex]::Match(
            $checksumText,
            '^\s*([0-9a-fA-F]{64})\s+'
          )

          if (-not $checksumMatch.Success) {
            throw "The checksum file does not contain a valid SHA-256 value."
          }

          $expectedSha256 = $checksumMatch.Groups[1].Value.ToLowerInvariant()
          $actualSha256 = (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actualSha256 -ne $expectedSha256) {
            throw "Release archive checksum mismatch. Expected $expectedSha256, got $actualSha256."
          }

          Write-Host "Release archive checksum verified: $actualSha256"

          # 2. Extract the actual archive.

          $verifyDir = Join-Path $env:RUNNER_TEMP "CMath-release-verification"

          if (Test-Path $verifyDir) {
            Remove-Item $verifyDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null

          Expand-Archive `
            -LiteralPath $archiveName `
            -DestinationPath $verifyDir `
            -Force

          $packagedMathmake = Join-Path $verifyDir "mathmake.exe"
          $smokeSource = Join-Path $verifyDir "examples/native_smoke.cmath"

          $requiredFiles = @(
            $packagedMathmake,
            (Join-Path $verifyDir "README.md"),
            (Join-Path $verifyDir "LICENSE"),
            $smokeSource
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required release package file is missing: $file"
            }
          }

          Write-Host "Required release package files are present."

          # 3. Test startup without LLVM on PATH.
          # DLL dependencies must be available beside mathmake.exe
          # or in Windows system directories.

          $originalPath = $env:PATH

          try {
            $env:PATH = Join-Path $env:SystemRoot "System32"

            $versionOutput = & $packagedMathmake --version 2>&1
            $versionExitCode = $LASTEXITCODE

            $versionOutput | ForEach-Object { Write-Host $_ }

            if ($versionExitCode -ne 0) {
              throw "Packaged mathmake failed to start or report its version without LLVM on PATH."
            }

            if (($versionOutput -join "`n") -notmatch "CMath mathmake 0\.2") {
              throw "Packaged mathmake returned an unexpected version."
            }

            # The check command must work without clang++.
            $checkOutput = & $packagedMathmake check $smokeSource 2>&1
            $checkExitCode = $LASTEXITCODE

            $checkOutput | ForEach-Object { Write-Host $_ }

            if ($checkExitCode -ne 0) {
              throw "Packaged mathmake check failed without LLVM on PATH."
            }

          }
          finally {
            $env:PATH = $originalPath
          }

          Write-Host "Packaged compiler startup and check tests passed."

          # 4. Relocate LLVM to simulate a different installation path.
          # This invalidates the path embedded during the CMake build.
          # With CMATH_CLANGXX unset, mathmake must discover clang++
          # through PATH instead.

          $originalLlvmRoot = $env:LLVM_ROOT
          $relocatedLlvmRoot = "$originalLlvmRoot-package-test"
          $relocatedLlvmBin = Join-Path $relocatedLlvmRoot "bin"

          $originalPath = $env:PATH
          $hadClangxx = Test-Path Env:CMATH_CLANGXX
          $originalClangxx = $env:CMATH_CLANGXX

          if (-not (Test-Path $originalLlvmRoot)) {
            throw "Original LLVM directory does not exist: $originalLlvmRoot"
          }

          if (Test-Path $relocatedLlvmRoot) {
            throw "LLVM relocation destination already exists: $relocatedLlvmRoot"
          }

          try {
            Move-Item `
              -LiteralPath $originalLlvmRoot `
              -Destination $relocatedLlvmRoot

            $env:PATH = "$relocatedLlvmBin;$originalPath"

            Remove-Item Env:CMATH_CLANGXX -ErrorAction SilentlyContinue

            $nativeOutputPath = Join-Path $verifyDir "native_smoke.exe"

            $nativeOutput = & $packagedMathmake run $smokeSource -o $nativeOutputPath 2>&1
            $nativeExitCode = $LASTEXITCODE

            $nativeOutput | ForEach-Object { Write-Host $_ }

            if ($nativeExitCode -ne 0) {
              throw "Packaged native compilation failed after relocating LLVM (exit code $nativeExitCode)."
            }

            if (-not (Test-Path $nativeOutputPath)) {
              throw "Packaged compiler did not produce the expected native executable."
            }

            $hasExpectedOutput = $nativeOutput |
              Where-Object { "$($_)".Trim() -eq "30" }

            if (-not $hasExpectedOutput) {
              throw "Packaged native smoke test did not print its expected result (30)."
            }

            Write-Host "Packaged compiler successfully discovered clang++ through PATH."

          }
          finally {
            $env:PATH = $originalPath

            if ($hadClangxx) {
              $env:CMATH_CLANGXX = $originalClangxx
            }
            else {
              Remove-Item Env:CMATH_CLANGXX -ErrorAction SilentlyContinue
            }

            # Restore the original LLVM directory.
            if (Test-Path $relocatedLlvmRoot) {
              Move-Item `
                -LiteralPath $relocatedLlvmRoot `
                -Destination $originalLlvmRoot
            }
          }

          Write-Host "All distributed package verification tests passed."

      # --------------------------------------------------
      # Publish
      # --------------------------------------------------

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CMath ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CMath-*-windows-x64.zip
            CMath-*-windows-x64.zip.sha256
