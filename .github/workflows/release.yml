name: CMath Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: cmath-release-${{ github.ref }}
  cancel-in-progress: false

env:
  LLVM_VERSION: "23.1.4"
  VCPKG_ROOT: "C:\\vcpkg"

jobs:
  build-and-release:
    name: Build and release CMath (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Cache the smaller zstd-compressed LLVM archive.
      - name: Restore LLVM archive cache
        id: llvm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst
          key: llvm-23.1.4-windows-x64-1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091

      - name: Download and verify LLVM 23.1.4
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $llvmArchiveName = "clang+llvm-$env:LLVM_VERSION-x86_64-pc-windows-msvc.tar.zst"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/$llvmArchiveName"
          $llvmArchive = Join-Path $env:RUNNER_TEMP $llvmArchiveName
          $expectedSha256 = "1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091"

          if (Test-Path $llvmArchive) {
            Write-Host "Using cached LLVM archive: $llvmArchive"
          }
          else {
            Write-Host "Downloading LLVM $env:LLVM_VERSION developer archive (about 264 MiB)..."
            & curl.exe --location --fail --show-error `
              --retry 5 --retry-all-errors --retry-delay 5 `
              --connect-timeout 30 --speed-limit 1024 --speed-time 120 `
              --max-time 1800 --progress-bar `
              --output $llvmArchive $llvmUrl

            if ($LASTEXITCODE -ne 0) {
              throw "LLVM download failed with curl exit code $LASTEXITCODE."
            }
          }

          Write-Host "Verifying LLVM archive SHA-256..."
          $actualSha256 = (Get-FileHash $llvmArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            Remove-Item $llvmArchive -Force -ErrorAction SilentlyContinue
            throw "LLVM archive SHA-256 mismatch. Expected $expectedSha256, got $actualSha256."
          }

          Write-Host "LLVM archive checksum verified."

      - name: Save LLVM archive cache
        if: success() && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst
          key: llvm-23.1.4-windows-x64-1a3f2f998e230b5791cc4e2bfe11a1f7c07fe42c96ff44f227c9db0bedfaf091

            - name: Extract LLVM archive
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"

          $llvmArchive = Join-Path $env:RUNNER_TEMP "clang+llvm-23.1.4-x86_64-pc-windows-msvc.tar.zst"
          $tarArchive = Join-Path $env:RUNNER_TEMP "llvm.tar"

          if (-not (Test-Path $llvmArchive)) {
            throw "LLVM archive not found: $llvmArchive"
          }

          Write-Host "Installing Zstandard decompression support..."
          python -m pip install --disable-pip-version-check --no-warn-script-location zstandard

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Python zstandard."
          }

          $env:LLVM_ARCHIVE_PATH = $llvmArchive
          $env:LLVM_TAR_PATH = $tarArchive

          Write-Host "Decompressing LLVM archive..."

          @'
          import os
          import zstandard

          source_path = os.environ["LLVM_ARCHIVE_PATH"]
          target_path = os.environ["LLVM_TAR_PATH"]

          with open(source_path, "rb") as source:
              with open(target_path, "wb") as target:
                  decompressor = zstandard.ZstdDecompressor(
                      max_window_size=2**31
                  )
                  decompressor.copy_stream(source, target)

          print("LLVM decompression completed.")
          '@ | python -

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to decompress LLVM archive."
          }

          Write-Host "Extracting LLVM files..."
          tar.exe -xf $tarArchive -C $env:RUNNER_TEMP

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract LLVM tar archive."
          }

          Remove-Item $tarArchive -Force

          # Persist LLVM paths for all subsequent workflow steps.
          $llvmRoot = Join-Path $env:RUNNER_TEMP "clang+llvm-23.1.4-x86_64-pc-windows-msvc"

          if (-not (Test-Path (Join-Path $llvmRoot "bin/clang++.exe"))) {
            throw "LLVM extraction failed: clang++.exe was not found."
          }

          if (-not (Test-Path (Join-Path $llvmRoot "lib/cmake/llvm/LLVMConfig.cmake"))) {
            throw "LLVM extraction failed: LLVMConfig.cmake was not found."
          }

          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LLVM_DIR=$(Join-Path $llvmRoot 'lib/cmake/llvm')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "LLVM_ROOT=$llvmRoot"
          Write-Host "LLVM_DIR=$(Join-Path $llvmRoot 'lib/cmake/llvm')"
          Write-Host "LLVM extraction completed successfully."

      # Reuse vcpkg already installed on the Windows runner.
      - name: Restore vcpkg dependency cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-2022-x64-static-zstd-${{ hashFiles('cmake/CMathNativeCompiler.cmake') }}
          restore-keys: |
            vcpkg-windows-2022-x64-static-zstd-

      - name: Install zstd dependency
        shell: pwsh
        timeout-minutes: 35
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_DISABLE_METRICS = "1"

          $vcpkgExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"

          if (-not (Test-Path $vcpkgExe)) {
            throw "The runner's vcpkg executable was not found: $vcpkgExe"
          }
          if (-not (Test-Path $vcpkgToolchain)) {
            throw "The vcpkg CMake toolchain was not found: $vcpkgToolchain"
          }

          Write-Host "Using vcpkg at $env:VCPKG_ROOT"
          & $vcpkgExe version
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query the vcpkg version."
          }

          Write-Host "Installing zstd:x64-windows-static..."
          & $vcpkgExe install zstd:x64-windows-static
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg failed to install zstd:x64-windows-static."
          }

          $zstdConfig = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/share/zstd/zstdConfig.cmake"
          if (-not (Test-Path $zstdConfig)) {
            throw "zstdConfig.cmake was not found at $zstdConfig"
          }

          Write-Host "zstd dependency is ready."

      - name: Save vcpkg dependency cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: vcpkg-windows-2022-x64-static-zstd-${{ hashFiles('cmake/CMathNativeCompiler.cmake') }}

      - name: Locate Visual Studio DIA SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio/Installer/vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at $vswhere."
          }

          $vsInstall = & $vswhere -latest -products "*" -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw "Could not locate the Visual Studio installation."
          }

          $diaDir = Join-Path $vsInstall "DIA SDK"
          if (-not (Test-Path $diaDir)) {
            throw "Visual Studio DIA SDK was not found at $diaDir."
          }

          "MSVC_DIA_SDK_DIR=$diaDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "DIA SDK found at $diaDir"

      - name: Configure CMake
        shell: pwsh
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Stop"

          $clangxx = Join-Path $env:LLVM_ROOT "bin/clang++.exe"
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          $zstdDir = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/share/zstd"

          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64 `
            "-DLLVM_DIR=$env:LLVM_DIR" `
            "-DMSVC_DIA_SDK_DIR=$env:MSVC_DIA_SDK_DIR" `
            "-DCMAKE_TOOLCHAIN_FILE=$vcpkgToolchain" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-static" `
            "-Dzstd_DIR=$zstdDir" `
            "-DCMATH_CLANGXX_EXECUTABLE=$clangxx"

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build mathmake
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = "Stop"

          cmake --build build-x64 --config Release --target mathmake --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "The mathmake build failed."
          }

      - name: Verify compiler version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = & .\build-x64\Release\mathmake.exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "mathmake --version failed."
          }

          Write-Host $version
          if ($version -notmatch "0\.2") {
            throw "Expected a CMath 0.2 mathmake binary, got: $version"
          }

      - name: Run native compiler smoke test
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          $output = & .\build-x64\Release\mathmake.exe run .\examples\native_smoke.cmath 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "The native compiler smoke test failed with exit code $exitCode."
          }

          $hasExpectedOutput = $output | Where-Object { "$($_)".Trim() -eq "30" }
          if (-not $hasExpectedOutput) {
            throw "The native smoke test did not print its expected result (30)."
          }

      - name: Package release files
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:GITHUB_REF_NAME
          $packageDir = Join-Path $env:RUNNER_TEMP "CMath-release"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item ".\build-x64\Release\mathmake.exe" $packageDir
          Copy-Item ".\README.md" $packageDir
          Copy-Item ".\LICENSE" $packageDir

          $examplesDir = Join-Path $packageDir "examples"
          New-Item -ItemType Directory -Force -Path $examplesDir | Out-Null
          Copy-Item ".\examples\native_smoke.cmath" $examplesDir

          if (Test-Path ".\examples\native_functions.cmath") {
            Copy-Item ".\examples\native_functions.cmath" $examplesDir
          }

          # Include LLVM's shared runtime if this LLVM distribution provides it.
          $llvmDll = Join-Path $env:LLVM_ROOT "bin/LLVM.dll"
          if (Test-Path $llvmDll) {
            Copy-Item $llvmDll $packageDir
          }

          $archiveName = "CMath-$tag-windows-x64.zip"
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $archiveName -Force

          $sha256 = (Get-FileHash $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archiveName.sha256", "$sha256  $archiveName`n")

          Write-Host "Created $archiveName"
          Write-Host "SHA-256: $sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CMath ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CMath-*-windows-x64.zip
            CMath-*-windows-x64.zip.sha256